<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{color-scheme:light dark}[hidden]{display:none!important}img{max-width:100%}</style>
<title>شجرة العائلة</title>
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a full-height tool. Slim top bar (name, search, data), a pannable tree canvas filling the rest,
   and one detail panel that is a side column on desktop and a bottom sheet on phones. */
:root{
  --bg:#EDF0EC; --surface:#F8FAF7; --ink:#15231D; --muted:#5C6B63; --edge:#C3CEC6;
  --line:#8FA397; --grid:#D3DBD5; --accent:#1D6B58; --accent-ink:#FFFFFF;
  --m-bg:#DCE8F2; --m-fg:#173A59; --f-bg:#F2DDE5; --f-fg:#5A1F3A;
  --danger:#A12D2D; --sel:#D9971A; --bark:#7A5C3E;
  --font-display:'Reem Kufi','Noto Kufi Arabic',Tahoma,system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#16211C; --ink:#E6EEE9; --muted:#8FA196; --edge:#2B3A33;
    --line:#5A7064; --grid:#1B2822; --accent:#4FC0A3; --accent-ink:#06130E;
    --m-bg:#1C3145; --m-fg:#BCD6EE; --f-bg:#412234; --f-fg:#F0C6D8;
    --danger:#F08080; --sel:#F0BC4A; --bark:#A98760; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211C; --ink:#E6EEE9; --muted:#8FA196; --edge:#2B3A33;
  --line:#5A7064; --grid:#1B2822; --accent:#4FC0A3; --accent-ink:#06130E;
  --m-bg:#1C3145; --m-fg:#BCD6EE; --f-bg:#412234; --f-fg:#F0C6D8;
  --danger:#F08080; --sel:#F0BC4A; --bark:#A98760; color-scheme:dark;
}
html,body{height:100%}
body{
  box-sizing:border-box; margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.6 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
}
.app{height:100%; display:flex; flex-direction:column; gap:12px; min-height:0}
.top{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px}
.brand{display:flex; align-items:center; gap:10px; flex:0 0 auto}
.brand svg{width:30px; height:30px; flex:none}
.brand h1{font:700 24px/1 var(--font-display); margin:0; letter-spacing:0}
.brand small{color:var(--muted); font-size:12.5px; display:block; margin-top:3px; font-variant-numeric:tabular-nums}
.search{flex:1 1 220px; max-width:420px; position:relative; min-width:0}
.spacer{flex:1 1 0}
input[type=text],input[type=search],textarea{
  font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--edge); border-radius:6px; padding:8px 10px;
  width:100%; box-sizing:border-box; min-width:0;
}
textarea{resize:vertical; min-height:150px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; line-height:1.5; direction:ltr; text-align:left}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.btn{
  font:500 14px/1.2 var(--font-body); color:var(--ink); background:var(--surface);
  border:1px solid var(--edge); border-radius:6px; padding:9px 14px; cursor:pointer;
}
.btn:hover{border-color:var(--line)}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,.icon-btn:focus-visible,.res button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.danger{color:var(--danger); border-color:color-mix(in srgb,var(--danger) 45%,var(--edge))}
.btn.sm{padding:6px 10px; font-size:13px}
.res{
  position:absolute; top:100%; inset-inline:0; z-index:20; margin-top:4px;
  background:var(--surface); border:1px solid var(--edge); border-radius:8px;
  max-height:260px; overflow:auto; box-shadow:0 8px 24px rgba(0,0,0,.16);
}
.res button{display:flex; justify-content:space-between; gap:10px; width:100%; text-align:start; border:0; background:none; color:var(--ink); font:inherit; padding:9px 12px; cursor:pointer}
.res button:hover{background:var(--bg)}
.res .none{padding:10px 12px; color:var(--muted)}
.res small{color:var(--muted); font-variant-numeric:tabular-nums}

.stage{position:relative; flex:1 1 0; min-height:0; border:1px solid var(--edge); border-radius:10px; overflow:hidden; background:var(--bg)}
.canvas{
  position:absolute; inset:0; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px); background-size:24px 24px;
}
.canvas.grabbing{cursor:grabbing}
.world{position:absolute; left:0; top:0; transform-origin:0 0}
.world.anim{transition:transform .35s ease}
.world svg{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
.card{
  position:absolute; width:124px; height:150px; box-sizing:border-box; padding:4px 0 0;
  border:0; background:none; border-radius:10px; color:var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  font:inherit; cursor:pointer;
}
.card .av{width:84px; height:84px; flex:none; border:4px solid var(--bark); font-size:34px;
  background:var(--surface); box-shadow:0 3px 10px rgba(0,0,0,.14)}
.card.m .av{border-color:var(--m-fg); background:var(--m-bg); color:var(--m-fg)}
.card.f .av{border-color:var(--f-fg); background:var(--f-bg); color:var(--f-fg)}
.card.dead .av{border-style:dashed}
.card .t{min-width:0; display:flex; flex-direction:column; gap:1px; background:var(--bg); border-radius:10px; padding:1px 8px; max-width:100%; box-sizing:border-box; align-items:center; text-align:center}
.card .n{font-weight:600; font-size:14px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .y{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; min-height:16px; line-height:1.3}
.card:hover .av{transform:translateY(-2px)}
.card .av{transition:transform .15s ease}
.card.sel .av{box-shadow:0 0 0 4px var(--sel),0 3px 10px rgba(0,0,0,.14)}
.card.sel{outline:0}
.card.hl .av{animation:pulse 1.2s ease 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--sel)}70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.card.hl .av,.card .av{animation:none;transition:none}.world.anim{transition:none}}

.av{width:40px; height:40px; border-radius:50%; flex:none; object-fit:cover; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb,currentColor 16%,transparent); font-weight:600; font-size:17px; line-height:1; overflow:hidden}
.av.big{width:72px; height:72px; font-size:30px; color:var(--ink)}
.phl{display:flex; align-items:center; gap:12px; min-width:0}
.photo-row{display:flex; align-items:center; gap:14px; margin-bottom:14px}
.photo-row .actions .btn{flex:0 0 auto}
.pop{position:absolute; z-index:6; pointer-events:none; background:var(--surface); border:1px solid var(--edge); border-radius:10px;
  padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.25); text-align:center; max-width:200px}
.pop img{width:176px; height:176px; border-radius:6px; object-fit:cover; display:block}
.pop b{display:block; margin-top:6px}
.pop small{color:var(--muted); font-variant-numeric:tabular-nums}
.empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; pointer-events:none}
.empty>div{pointer-events:auto; max-width:360px}
.empty h2{font:700 22px/1.3 var(--font-display); margin:0 0 8px; text-wrap:balance}
.empty p{margin:0 0 16px; color:var(--muted)}

.banner{
  position:absolute; z-index:3; top:12px; right:12px; max-width:calc(100% - 24px);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--edge); border-radius:8px; padding:8px 12px; font-size:13.5px;
}
.zoom{position:absolute; z-index:4; bottom:12px; right:12px; display:flex; gap:6px}
.zoom .btn{min-width:40px; padding:8px 10px}

.panel{
  position:absolute; z-index:5; background:var(--surface); border:1px solid var(--edge);
  box-shadow:0 10px 34px rgba(0,0,0,.2); overflow:auto; padding:16px; box-sizing:border-box;
}
@media (min-width:820px){.panel{top:12px; bottom:12px; left:12px; width:344px; border-radius:10px}}
@media (max-width:819.98px){
  .panel{left:0; right:0; bottom:0; max-height:66%; border-radius:14px 14px 0 0; border-width:1px 0 0}
  .stage[data-panel="open"] .zoom{display:none}
}
.ph{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px}
.ph h2{font:700 21px/1.3 var(--font-display); margin:0; text-wrap:balance}
.ph .meta{color:var(--muted); font-size:13.5px; margin:2px 0 0; font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--edge); background:var(--bg); color:var(--ink); width:34px; height:34px; border-radius:6px; font-size:18px; line-height:1; cursor:pointer; flex:none}
.rel{display:grid; grid-template-columns:auto 1fr; gap:8px 12px; margin:0 0 14px; align-items:baseline}
.rel dt{color:var(--muted); font-size:13px}
.rel dd{margin:0; display:flex; flex-wrap:wrap; gap:6px}
.chip{font:inherit; font-size:13.5px; border:1px solid var(--edge); background:var(--bg); color:var(--ink); border-radius:999px; padding:2px 11px; cursor:pointer}
.chip:hover{border-color:var(--line)}
.note{margin:0 0 14px; padding:10px 12px; background:var(--bg); border-radius:6px; font-size:14px}
.actions{display:flex; flex-wrap:wrap; gap:8px}
.actions .btn{flex:1 1 auto}
.sep{border:0; border-top:1px solid var(--edge); margin:14px 0}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px; min-width:0}
.field>span,.field legend{font-size:13px; color:var(--muted); padding:0}
fieldset.field{border:0; margin:0 0 12px; padding:0}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.seg{display:flex; gap:8px}
.seg label{flex:1; position:relative}
.seg input{position:absolute; opacity:0; inset:0; cursor:pointer}
.seg span{display:block; text-align:center; padding:8px 10px; border:1px solid var(--edge); border-radius:6px; background:var(--bg)}
.seg input:checked+span{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.seg input:focus-visible+span{outline:3px solid var(--accent); outline-offset:2px}
.err{color:var(--danger); font-size:13.5px; margin:0 0 10px}
.ok{color:var(--accent); font-size:13.5px; margin:8px 0 0}
.hint{color:var(--muted); font-size:13px; margin:0 0 12px}
.confirm{background:var(--bg); border:1px solid color-mix(in srgb,var(--danger) 40%,var(--edge)); border-radius:8px; padding:12px; margin-top:12px}
.confirm p{margin:0 0 10px; font-size:14px}
.upd{color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums}
.gate{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg); z-index:50}
.gcard{width:100%; max-width:340px; display:flex; flex-direction:column; gap:6px; align-items:stretch}
.gcard svg{align-self:center}
.gcard h1{font:700 28px/1.3 var(--font-display); margin:6px 0 0; text-align:center}
.gcard p{margin:0 0 10px; color:var(--muted); text-align:center; font-size:14px}
input[type=password]{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--edge); border-radius:6px; padding:10px; width:100%; box-sizing:border-box}
input[type=password]:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.gcard p.err{color:var(--danger); min-height:1.6em; margin:0}
</style>


</head>
<body>
<div class="gate" id="gate" dir="rtl">
  <form id="gform" class="gcard" autocomplete="off">
    <svg viewBox="0 0 32 32" width="40" height="40" aria-hidden="true"><g fill="none" stroke="var(--line)" stroke-width="2"><path d="M16 11v5M7 16h18M7 16v4M25 16v4"/></g><rect x="10" y="3" width="12" height="8" rx="2" fill="var(--accent)"/><rect x="2" y="20" width="10" height="8" rx="2" fill="var(--m-fg)"/><rect x="20" y="20" width="10" height="8" rx="2" fill="var(--f-fg)"/></svg>
    <h1>شجرة العائلة</h1>
    <p>أدخل كلمة السر التي أعطاك إياها أحد أفراد العائلة.</p>
    <label class="field"><span>كلمة السر</span><input type="password" id="gpass" required autocomplete="current-password"></label>
    <p class="err" id="gerr" role="alert"></p>
    <button class="btn primary" id="gbtn" type="submit" style="width:100%">فتح الشجرة</button>
  </form>
</div>
<div class="app" id="app" dir="rtl" lang="ar" hidden>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <g fill="none" stroke="var(--line)" stroke-width="2"><path d="M16 11v5M7 16h18M7 16v4M25 16v4"/></g>
        <rect x="10" y="3" width="12" height="8" rx="2" fill="var(--accent)"/>
        <rect x="2" y="20" width="10" height="8" rx="2" fill="var(--m-fg)"/>
        <rect x="20" y="20" width="10" height="8" rx="2" fill="var(--f-fg)"/>
      </svg>
      <div>
        <h1>جذور</h1>
        <small id="stats">شجرة العائلة</small>
      </div>
    </div>
    <div class="search">
      <input type="search" id="q" placeholder="ابحث عن اسم في الشجرة" autocomplete="off" aria-label="بحث عن شخص">
      <div class="res" id="res" hidden></div>
    </div>
    <div class="spacer"></div>
    <small class="upd">آخر تحديث: 2026-11-06</small>
  </header>

  <main class="stage" id="stage">
    <div class="canvas" id="canvas"><div class="world" id="world"></div></div>
    <div class="empty" id="empty" hidden>
      <div>
        <h2>الشجرة فارغة</h2>
        
      </div>
    </div>
    <div class="zoom" id="zoom">
      <button class="btn" type="button" data-z="in" aria-label="تكبير">+</button>
      <button class="btn" type="button" data-z="out" aria-label="تصغير">−</button>
      <button class="btn" type="button" data-z="fit">ملاءمة</button>
    </div>
    <div class="pop" id="pop" hidden></div>
    <aside class="panel" id="panel" hidden></aside>
  </main>
</div>

<script>
(function(){
  try{document.documentElement.lang='ar';document.documentElement.dir='rtl';}catch(e){}
  var DATA=[];
  var CW=124,CH=150,SP=30,GX=22,GY=74,RG=60,PAD=40,AVC=48;
  var state={people:[],sample:false};
  var ui={sel:null,mode:null,form:null,err:'',msg:'',confirmDel:false,confirmClear:false,ptitle:'شجرة العائلة'};
  var view={x:0,y:0,k:1};
  var L=null;

  var $=function(s){return document.querySelector(s)};
  var canvas=$('#canvas'),world=$('#world'),stage=$('#stage'),panel=$('#panel'),
      emptyEl=$('#empty'),pop=$('#pop'),stats=$('#stats'),q=$('#q'),res=$('#res');

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function load(){state={people:DATA,sample:false}}
  function save(){}
  var saveFail=false;
  function initial(p){var n=(p.name||'').trim();return n?Array.from(n)[0]:'؟'}
  function avHtml(p,big){
    var c='av'+(big?' big':'');
    return p.photo?'<img class="'+c+'" src="'+esc(p.photo)+'" alt="">':'<span class="'+c+'">'+esc(initial(p))+'</span>';
  }
  function loadPhoto(file,cb){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)*(im.height>im.width?0.25:0.5);
        var c=document.createElement('canvas');c.width=c.height=256;
        c.getContext('2d').drawImage(im,sx,sy,s,s,0,0,256,256);
        cb(c.toDataURL('image/jpeg',0.75));
      };
      im.onerror=function(){cb(null)};
      im.src=fr.result;
    };
    fr.onerror=function(){cb(null)};
    fr.readAsDataURL(file);
  }
  function byId(id){for(var i=0;i<state.people.length;i++){if(state.people[i].id===id)return state.people[i]}return null}
  function idxOf(id){for(var i=0;i<state.people.length;i++){if(state.people[i].id===id)return i}return -1}
  function cmpP(a,b){
    var x=parseInt(a.birth,10),y=parseInt(b.birth,10);
    var xa=isNaN(x)?1e9:x,ya=isNaN(y)?1e9:y;
    return (xa-ya)||(idxOf(a.id)-idxOf(b.id));
  }
  function years(p){
    if(p.birth&&p.death)return p.birth+' – '+p.death;
    if(p.birth)return 'مواليد '+p.birth;
    if(p.death)return 'توفي '+p.death;
    return '';
  }
  function childrenOf(p){
    var sp=p.spouse?byId(p.spouse):null;
    return state.people.filter(function(c){return c.parent&&(c.parent===p.id||(sp&&c.parent===sp.id))}).sort(cmpP);
  }

  /* ---------- layout ---------- */
  function computeLayout(){
    var people=state.people;
    var map={};people.forEach(function(p){map[p.id]=p});
    var idx={};people.forEach(function(p,i){idx[p.id]=i});
    function hasParent(p){return !!(p.parent&&map[p.parent])}
    function sp(p){return p.spouse&&map[p.spouse]?map[p.spouse]:null}
    function cmp(a,b){
      var x=parseInt(a.birth,10),y=parseInt(b.birth,10);
      var xa=isNaN(x)?1e9:x,ya=isNaN(y)?1e9:y;
      return (xa-ya)||(idx[a.id]-idx[b.id]);
    }
    function isRoot(p){
      if(hasParent(p))return false;
      var s=sp(p);
      if(!s)return true;
      if(hasParent(s))return false;
      return idx[p.id]<idx[s.id];
    }
    var seen={};
    function members(p){
      var s=sp(p);
      if(!s)return [p];
      if(p.gender==='m'&&s.gender!=='m')return [s,p];
      if(p.gender!=='m'&&s.gender==='m')return [p,s];
      return [s,p];
    }
    function build(p){
      seen[p.id]=true;
      var s=sp(p);
      if(s)seen[s.id]=true;
      var kids=people.filter(function(c){
        return c.parent&&(c.parent===p.id||(s&&c.parent===s.id))&&!seen[c.id];
      }).sort(cmp);
      var mem=members(p);
      var n={mem:mem,w:mem.length*CW+(mem.length-1)*SP,kids:[]};
      kids.forEach(function(c){if(!seen[c.id])n.kids.push(build(c))});
      var kw=0;
      n.kids.forEach(function(k){kw+=k.sw});
      kw+=GX*Math.max(0,n.kids.length-1);
      n.kw=kw;n.sw=Math.max(n.w,kw);
      return n;
    }
    var nodes=[];
    function place(n,left,d){
      n.d=d;n.y=d*(CH+GY);n.cx=left+n.sw/2;n.x=n.cx-n.w/2;
      nodes.push(n);
      var c=left+(n.sw-n.kw)/2;
      n.kids.slice().reverse().forEach(function(k){place(k,c,d+1);c+=k.sw+GX});
    }
    var roots=people.filter(isRoot).sort(cmp).map(build);
    var left=PAD,maxD=0;
    roots.slice().reverse().forEach(function(r){place(r,left,0);left+=r.sw+RG});
    var W=Math.max(left-RG+PAD,2*PAD);
    nodes.forEach(function(n){if(n.d>maxD)maxD=n.d});
    var H=(maxD+1)*(CH+GY)-GY+2*PAD/2;
    var pos={};
    nodes.forEach(function(n){
      n.mem.forEach(function(p,i){pos[p.id]={x:n.x+i*(CW+SP),y:n.y+PAD/2}});
    });
    var lineD='',linkD='',dots=[];
    nodes.forEach(function(n){
      var ny=n.y+PAD/2;
      var jy=ny+CH+8;
      if(n.mem.length===2){
        var ly=ny+AVC;
        linkD+='M'+(n.x+CW-16)+' '+ly+'H'+(n.x+CW+SP+16);
        dots.push([n.cx,ly]);
      }
      if(n.kids.length){
        var y0=n.mem.length===2?ny+AVC:ny+CH;
        lineD+='M'+n.cx+' '+y0+'V'+jy;
        n.kids.forEach(function(k){
          var ky=k.y+PAD/2;
          var my=jy+(ky-jy)/2;
          lineD+='M'+n.cx+' '+jy+'C'+n.cx+' '+my+' '+k.cx+' '+my+' '+k.cx+' '+ky;
          if(k.mem.length===2)lineD+='V'+(ky+AVC);
        });
      }
    });
    return {pos:pos,W:W,H:H,lineD:lineD,linkD:linkD,dots:dots,gens:people.length?maxD+1:0,shown:Object.keys(pos).length};
  }

  function applyView(){world.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.k+')'}
  function fit(animate){
    if(!L||!state.people.length)return;
    var cw=canvas.clientWidth,ch=canvas.clientHeight;
    if(!cw||!ch)return;
    var k=Math.min(1,(cw-32)/L.W,(ch-32)/L.H);
    k=Math.max(.2,k);
    view.k=k;view.x=(cw-L.W*k)/2;view.y=Math.max(16,(ch-L.H*k)/2);
    anim(animate);applyView();
  }
  var animT=null;

  function focusOn(id,pulse){
    if(!L||!L.pos[id])return;

    var cx=cw/2,cy=ch/2;
    if(open&&isDesktop()){cx=(cw+356)/2}
    if(open&&!isDesktop()){cy=ch*0.3}
    view.k=Math.max(view.k,.8);
    var o=L.pos[id];
    view.x=cx-(o.x+CW/2)*view.k;
    view.y=cy-(o.y+CH/2)*view.k;
    anim(true);applyView();
    if(pulse){
      var el=world.querySelector('[data-id="'+id+'"]');

  function deleteSet(p){
    var s=p.spouse?byId(p.spouse):null;
    if(s)return [p.id];
    var out={};
    function walk(x){
      out[x.id]=true;
      var xs=x.spouse?byId(x.spouse):null;
      if(xs)out[xs.id]=true;
      childrenOf(x).forEach(function(c){if(!out[c.id])walk(c)});
    }
    walk(p);
    return Object.keys(out);
  }
  function doDelete(p){
    var s=p.spouse?byId(p.spouse):null;
    if(s){
      state.people.forEach(function(c){if(c.parent===p.id)c.parent=s.id});
      s.spouse=null;
      state.people=state.people.filter(function(x){return x.id!==p.id});
    }else{
      var ids=deleteSet(p);
      state.people=state.people.filter(function(x){return ids.indexOf(x.id)<0});
    }
    var live={};state.people.forEach(function(x){live[x.id]=true});
    state.people.forEach(function(x){
      if(x.parent&&!live[x.parent])x.parent=null;
      if(x.spouse&&!live[x.spouse])x.spouse=null;
    });
    save();
    ui.sel=null;ui.mode=null;ui.confirmDel=false;
    render();
    if(state.people.length)fit(true);

  function importText(txt){
    var data;
    try{data=JSON.parse(txt)}catch(e){return 'النص ليس بيانات صحيحة. انسخه كاملًا من خيار النسخ وحاول مرة أخرى.'}
    if(data&&Array.isArray(data.people))data=data.people;
    if(!Array.isArray(data))return 'لم أجد قائمة أشخاص في هذا النص.';
    var ids={},out=[];
    for(var i=0;i<data.length;i++){
      var d=data[i];
      if(!d||typeof d.id!=='string'||typeof d.name!=='string'||!d.name.trim()||ids[d.id])return 'بيانات الشخص رقم '+(i+1)+' غير مكتملة.';
      ids[d.id]=true;
      out.push({id:d.id,name:d.name.trim(),gender:d.gender==='f'?'f':'m',birth:d.birth?String(d.birth):'',death:d.death?String(d.death):'',note:d.note?String(d.note):'',photo:(typeof d.photo==='string'&&d.photo.indexOf('data:image/')===0)?d.photo:'',parent:d.parent||null,spouse:d.spouse||null});
    }
    var map={};out.forEach(function(p){map[p.id]=p});
    out.forEach(function(p){
      if(p.parent&&(!map[p.parent]||p.parent===p.id))p.parent=null;
      if(p.spouse&&(!map[p.spouse]||p.spouse===p.id))p.spouse=null;
    });
    out.forEach(function(p){
      if(p.spouse){var s=map[p.spouse];if(s.spouse!==p.id){if(s.spouse)p.spouse=null;else s.spouse=p.id}}
    });
    out.forEach(function(p){
      var seen={},cur=p;
      while(cur&&cur.parent){if(seen[cur.id]){cur.parent=null;break}seen[cur.id]=true;cur=map[cur.parent]}
    });
    out.forEach(function(p){
      if(!p.photo){var old=byId(p.id);if(old&&old.photo)p.photo=old.photo}
    });
    state.people=out;state.sample=false;
    return '';
  }

  /* ---------- events ---------- */
  panel.addEventListener('click',function(e){

    if(act==='cancel-del'){ui.confirmDel=false;renderPanel();return}

    if(act==='copy'){
      var ta=$('#data-text');if(!ta)return;
      var done=function(ok){ui.err=ok?'':'تعذّر النسخ تلقائيًا. النص محدد الآن، اضغط نسخ من لوحة المفاتيح.';ui.msg=ok?'تم نسخ البيانات.':'';
        var cur=ta.value;renderPanel();var t2=$('#data-text');if(t2){t2.value=cur;if(!ok){t2.focus();t2.select()}}};
      var fallback=function(){ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(x){}done(ok)};
      try{navigator.clipboard.writeText(ta.value).then(function(){done(true)},fallback)}catch(x){fallback()}
      return;
    }
    if(act==='import'){
      var t=$('#data-text');if(!t)return;
      var err=importText(t.value);
      if(err){ui.err=err;ui.msg='';renderPanel();var t3=$('#data-text');if(t3)t3.value=t.value;return}
      save();ui.err='';ui.msg='تمت استعادة الشجرة.';ui.sel=null;ui.confirmClear=false;
      render();fit(false);return;
    }
    if(act==='ask-clear'){ui.confirmClear=true;renderPanel();return}
    if(act==='cancel-clear'){ui.confirmClear=false;renderPanel();return}
    if(act==='do-clear'){
      state={people:[],sample:false};save();ui.sel=null;ui.mode=null;ui.confirmClear=false;
      render();return;
    }
  });
  function imgLoad(src){
    return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src});
  }
  function wrapName(c,t,w){
    var ws=t.split(/\s+/),ls=[],cur='';
    ws.forEach(function(x){var tt=cur?cur+' '+x:x;if(!cur||c.measureText(tt).width<=w)cur=tt;else{ls.push(cur);cur=x}});
    if(cur)ls.push(cur);
    if(ls.length>2)ls=[ls[0],ls.slice(1).join(' ')];
    if(ls.length===2&&c.measureText(ls[1]).width>w){while(ls[1].length>1&&c.measureText(ls[1]+'…').width>w)ls[1]=ls[1].slice(0,-1);ls[1]+='…'}
    return ls;
  }
  function buildPdf(jpg,pxw,pxh,wpt,hpt){
    var parts=[],off=[],len=0;
    function enc(t){var a=new Uint8Array(t.length);for(var i=0;i<t.length;i++)a[i]=t.charCodeAt(i)&255;return a}
    function add(u){parts.push(u);len+=u.length}
    function obj(n,body){off[n]=len;add(enc(n+' 0 obj\n'+body+'\nendobj\n'))}
    add(enc('%PDF-1.4\n'));

  function b64(x){var b=atob(x),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function start(d){
    DATA=d;load();render();
    requestAnimationFrame(function(){fit(false)});
    window.addEventListener('load',function(){if(!ui.mode)fit(false)});
  }
  function unlock(pw){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BOX.s),iterations:BOX.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
      .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BOX.i)},k,b64(BOX.c))})
      .then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
  }
  var gate=document.getElementById('gate'),gf=document.getElementById('gform'),gp=document.getElementById('gpass'),ge=document.getElementById('gerr'),gb=document.getElementById('gbtn');
  gf.addEventListener('submit',function(e){

    if(!(window.crypto&&crypto.subtle)){ge.textContent='هذا المتصفح لا يدعم فتح الصفحة. جرّب متصفحًا حديثًا.';return}
    gb.disabled=true;ge.textContent='';gb.textContent='جارٍ الفتح...';
    unlock(gp.value).then(function(d){

    },function(){
